version: 2
updates:
  # Python dependencies — resolved against pyproject.toml + uv.lock.
  # Direct deps only: transitive CUDA/cuDNN libraries (nvidia-*, cuda-bindings)
  # are pinned by the torch cu126 wheel and must not be bumped independently.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: build
      include: scope

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
